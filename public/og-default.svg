<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="120" r="280" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
  <circle cx="1080" cy="120" r="200" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.1"/>
  <circle cx="100" cy="560" r="160" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.1"/>

  <!-- Accent bar -->
  <rect x="80" y="310" width="80" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Blog name -->
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="800" fill="#f8fafc" letter-spacing="-2">peter</text>
  <text x="80" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="800" fill="url(#accent)" letter-spacing="-2">to-better</text>

  <!-- Tagline -->
  <text x="80" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#94a3b8" letter-spacing="1">技術分享與成長的天地</text>

  <!-- Domain -->
  <text x="80" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#475569">peter-to-better.com</text>
</svg>
